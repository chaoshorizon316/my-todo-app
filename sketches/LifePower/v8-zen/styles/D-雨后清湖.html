<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心汐 · 雨后清湖</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&family=Noto+Sans+SC:wght@200;300;400&display=swap');

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh;
    background: linear-gradient(180deg, #c8d4df 0%, #d4dee7 40%, #dce6ed 100%);
    font-family: 'Noto Sans SC', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
  }

  .phone {
    width: 390px; height: 844px;
    background: linear-gradient(180deg, #dce6ed 0%, #e0e9ef 35%, #e4ecf2 100%);
    border-radius: 44px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.03), 0 0 120px rgba(150,170,190,0.2), 0 30px 80px rgba(0,0,0,0.06);
  }

  .content {
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    height: 100%; padding: 0 32px;
  }

  .status-bar { height: 54px; }

  /* Header */
  .header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0 24px;
  }

  .header-title {
    font-family: 'Noto Serif SC', serif;
    font-size: 28px; font-weight: 300;
    color: rgba(60,75,90,0.7);
    letter-spacing: 0.15em;
  }

  .header-subtitle {
    font-size: 12px; font-weight: 200;
    color: rgba(110,130,150,0.35);
    letter-spacing: 0.2em;
    margin-top: 2px;
  }

  .header-avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, rgba(180,195,210,0.4), rgba(140,160,180,0.25));
    border: 1px solid rgba(150,170,190,0.15);
  }

  /* Lake area */
  .lake-container {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    position: relative;
  }

  .lake {
    width: 280px; height: 280px;
    border-radius: 50%;
    position: relative;
    background: radial-gradient(ellipse at 50% 50%,
      rgba(175,195,210,0.45) 0%,
      rgba(160,182,200,0.5) 25%,
      rgba(145,170,190,0.55) 50%,
      rgba(155,178,198,0.45) 75%,
      rgba(165,185,205,0.35) 100%
    );
    box-shadow:
      0 0 100px rgba(140,160,180,0.15),
      inset 0 0 100px rgba(190,205,220,0.4);
    overflow: hidden;
  }

  /* Rain droplet */
  .raindrop {
    position: absolute;
    width: 2px; height: 8px;
    background: linear-gradient(180deg, transparent, rgba(180,200,220,0.6), rgba(200,215,230,0.8));
    border-radius: 0 0 2px 2px;
    animation: dropFall var(--dur) linear infinite;
    animation-delay: var(--delay);
    opacity: 0;
  }

  @keyframes dropFall {
    0% { transform: translateY(-20px); opacity: 0; }
    5% { opacity: 0.7; }
    90% { opacity: 0.6; }
    100% { transform: translateY(310px); opacity: 0; }
  }

  /* Rain ripple */
  .rain-ripple {
    position: absolute;
    border-radius: 50%;
    border: 0.5px solid rgba(160,180,200,0.2);
    animation: rippleBurst var(--dur) ease-out infinite;
    animation-delay: var(--delay);
    opacity: 0;
  }

  @keyframes rippleBurst {
    0% { width: 0; height: 0; opacity: 0.6; }
    100% { width: 50px; height: 50px; opacity: 0; }
  }

  /* Soft center glow */
  .lake-center {
    position: absolute;
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 70px; height: 70px;
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(170,190,210,0.15) 0%,
      rgba(155,178,200,0.08) 50%,
      transparent 100%
    );
    animation: centerBreathe 7s ease-in-out infinite;
  }

  @keyframes centerBreathe {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.4; }
    50% { transform: translate(-50%, -50%) scale(1.25); opacity: 0.7; }
  }

  /* Subtle water texture */
  .water-texture {
    position: absolute;
    width: 100%; height: 0.5px;
    background: linear-gradient(90deg, transparent, rgba(150,170,190,0.08), transparent);
    left: 0;
    animation: textureShimmer var(--dur) ease-in-out infinite;
    animation-delay: var(--delay);
  }

  @keyframes textureShimmer {
    0%, 100% { opacity: 0.1; }
    50% { opacity: 0.3; }
  }

  /* Status text */
  .status-text {
    margin-top: 32px;
    text-align: center;
  }

  .status-line {
    font-family: 'Noto Serif SC', serif;
    font-size: 14px; font-weight: 300;
    color: rgba(80,100,115,0.45);
    letter-spacing: 0.12em;
    line-height: 2;
  }

  .status-count {
    color: rgba(60,80,100,0.6);
    font-weight: 400;
  }

  /* Bottom area */
  .bottom-area {
    padding-bottom: 100px;
    display: flex;
    justify-content: center;
  }

  .throw-btn {
    padding: 14px 48px;
    border-radius: 28px;
    background: rgba(170,190,210,0.2);
    border: 1px solid rgba(140,165,185,0.2);
    color: rgba(70,90,110,0.65);
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 15px; font-weight: 300;
    letter-spacing: 0.15em;
    cursor: pointer;
    transition: all 0.8s ease;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    position: relative;
    overflow: hidden;
  }

  /* Water droplet texture on button */
  .throw-btn::before {
    content: '';
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(circle at 30% 40%, rgba(200,215,230,0.3), transparent 50%);
    opacity: 0.3;
  }

  .throw-btn:hover {
    background: rgba(170,190,210,0.35);
    border-color: rgba(130,155,180,0.3);
    color: rgba(50,70,90,0.8);
    box-shadow: 0 4px 24px rgba(130,155,180,0.12);
  }

  /* Bottom Tab Bar */
  .tab-bar {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 84px;
    background: linear-gradient(to top, rgba(220,230,237,0.95) 0%, rgba(220,230,237,0.7) 60%, transparent 100%);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    display: flex; align-items: flex-start;
    padding: 12px 16px 20px;
    border-top: 0.5px solid rgba(170,185,200,0.12);
  }

  .tab {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; gap: 4px;
    cursor: pointer;
    transition: all 0.4s ease;
  }

  .tab-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: rgba(130,150,170,0.2);
    margin: 8px auto 0;
    transition: all 0.4s ease;
  }

  .tab.active .tab-dot {
    background: rgba(70,95,120,0.45);
    box-shadow: 0 0 8px rgba(70,95,120,0.12);
  }

  .tab-label {
    font-size: 10px; font-weight: 300;
    color: rgba(130,150,170,0.3);
    letter-spacing: 0.1em;
    transition: all 0.4s ease;
  }

  .tab.active .tab-label {
    color: rgba(60,85,110,0.55);
  }

  /* Subtle vignette */
  .vignette {
    position: absolute; inset: 0; pointer-events: none; z-index: 0;
    background: radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(200,210,220,0.25) 100%);
  }
</style>
</head>
<body>
<div class="phone">
  <div class="vignette"></div>

  <div class="content">
    <div class="status-bar"></div>

    <div class="header">
      <div>
        <div class="header-title">心湖</div>
        <div class="header-subtitle">SHINKO</div>
      </div>
      <div class="header-avatar"></div>
    </div>

    <div class="lake-container">
      <div class="lake">
        <!-- Water texture lines -->
        <div class="water-texture" style="top:18%;--dur:5s;--delay:0s;"></div>
        <div class="water-texture" style="top:32%;--dur:6s;--delay:1.2s;"></div>
        <div class="water-texture" style="top:48%;--dur:5.5s;--delay:2.5s;"></div>
        <div class="water-texture" style="top:62%;--dur:6.5s;--delay:3.8s;"></div>
        <div class="water-texture" style="top:76%;--dur:5.8s;--delay:1.8s;"></div>

        <!-- Rain droplets -->
        <div class="raindrop" style="top:-10px;left:25%;--dur:3s;--delay:0s;"></div>
        <div class="raindrop" style="top:-10px;left:55%;--dur:3.5s;--delay:0.8s;"></div>
        <div class="raindrop" style="top:-10px;left:72%;--dur:2.8s;--delay:1.6s;"></div>
        <div class="raindrop" style="top:-10px;left:38%;--dur:3.2s;--delay:2.2s;"></div>
        <div class="raindrop" style="top:-10px;left:60%;--dur:3.8s;--delay:3s;"></div>
        <div class="raindrop" style="top:-10px;left:18%;--dur:3.1s;--delay:3.6s;"></div>
        <div class="raindrop" style="top:-10px;left:80%;--dur:3.4s;--delay:4.2s;"></div>
        <div class="raindrop" style="top:-10px;left:45%;--dur:2.9s;--delay:4.8s;"></div>
        <div class="raindrop" style="top:-10px;left:68%;--dur:3.6s;--delay:2.8s;"></div>
        <div class="raindrop" style="top:-10px;left:32%;--dur:3.3s;--delay:5.2s;"></div>

        <!-- Rain ripples (appear slightly after drops land) -->
        <div class="rain-ripple" style="top:75%;left:25%;--dur:2.5s;--delay:0.4s;"></div>
        <div class="rain-ripple" style="top:78%;left:55%;--dur:2.8s;--delay:1.2s;"></div>
        <div class="rain-ripple" style="top:72%;left:72%;--dur:2.3s;--delay:2s;"></div>
        <div class="rain-ripple" style="top:76%;left:38%;--dur:2.6s;--delay:2.6s;"></div>
        <div class="rain-ripple" style="top:80%;left:60%;--dur:2.4s;--delay:3.4s;"></div>
        <div class="rain-ripple" style="top:74%;left:18%;--dur:2.7s;--delay:4s;"></div>
        <div class="rain-ripple" style="top:77%;left:80%;--dur:2.5s;--delay:4.6s;"></div>
        <div class="rain-ripple" style="top:73%;left:45%;--dur:2.9s;--delay:5.2s;"></div>

        <div class="lake-center"></div>
      </div>

      <div class="status-text">
        <div class="status-line">雨后湖面初平</div>
        <div class="status-line">有 <span class="status-count">零</span> 人听见你的回响</div>
      </div>

      <div class="bottom-area" style="margin-top:36px;">
        <button class="throw-btn">投一颗石子</button>
      </div>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tab active">
      <div class="tab-dot"></div>
      <span class="tab-label">心湖</span>
    </div>
    <div class="tab">
      <div class="tab-dot"></div>
      <span class="tab-label">涟漪</span>
    </div>
    <div class="tab">
      <div class="tab-dot"></div>
      <span class="tab-label">回响</span>
    </div>
    <div class="tab">
      <div class="tab-dot"></div>
      <span class="tab-label">宿缘</span>
    </div>
  </div>
</div>
</body>
</html>
