<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心汐 · 深夜湖心</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&family=Noto+Sans+SC:wght@200;300;400&display=swap');

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; background: #050d18;
    font-family: 'Noto Sans SC', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
  }

  .phone {
    width: 390px; height: 844px;
    background: #0a1628;
    border-radius: 44px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 0 0 2px #1a2a44, 0 0 80px rgba(10,80,160,0.15), 0 30px 80px rgba(0,0,0,0.5);
  }

  /* Stars canvas layer */
  .stars-layer {
    position: absolute; inset: 0; pointer-events: none; z-index: 0;
  }

  .star {
    position: absolute;
    width: 2px; height: 2px;
    background: #fff;
    border-radius: 50%;
    animation: starBreathe var(--dur) ease-in-out infinite;
    animation-delay: var(--delay);
    opacity: 0;
  }

  @keyframes starBreathe {
    0%, 100% { opacity: 0.15; }
    50% { opacity: 0.8; }
  }

  /* Star reflections on lake */
  .star-reflection {
    position: absolute;
    width: var(--w); height: 1px;
    background: linear-gradient(90deg, transparent, rgba(180,200,240,var(--bright)), transparent);
    border-radius: 50%;
    animation: reflectShimmer var(--dur) ease-in-out infinite;
    animation-delay: var(--delay);
    opacity: 0;
  }

  @keyframes reflectShimmer {
    0%, 100% { opacity: 0; transform: scaleX(0.3); }
    50% { opacity: 0.5; transform: scaleX(1); }
  }

  /* Main content */
  .content {
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    height: 100%; padding: 0 32px;
  }

  /* Status bar placeholder */
  .status-bar { height: 54px; }

  /* Header */
  .header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0 24px;
  }

  .header-title {
    font-family: 'Noto Serif SC', serif;
    font-size: 28px; font-weight: 300;
    color: rgba(200,215,240,0.9);
    letter-spacing: 0.15em;
  }

  .header-subtitle {
    font-size: 12px; font-weight: 200;
    color: rgba(140,170,210,0.5);
    letter-spacing: 0.2em;
    margin-top: 2px;
  }

  .header-avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, rgba(180,200,230,0.3), rgba(30,60,120,0.4));
    border: 1px solid rgba(140,170,210,0.2);
  }

  /* Lake area */
  .lake-container {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    position: relative;
  }

  .lake {
    width: 280px; height: 280px;
    border-radius: 50%;
    position: relative;
    background: radial-gradient(ellipse at 50% 50%,
      rgba(20,40,80,0.6) 0%,
      rgba(12,28,56,0.8) 30%,
      rgba(8,18,40,0.95) 60%,
      rgba(5,12,28,1) 100%
    );
    box-shadow:
      0 0 80px rgba(20,60,140,0.08),
      inset 0 0 120px rgba(5,15,35,0.8);
    overflow: hidden;
  }

  /* Ripple rings */
  .ripple {
    position: absolute;
    top: 50%; left: 50%;
    width: 0; height: 0;
    border-radius: 50%;
    border: 0.5px solid rgba(140,180,220,0.12);
    transform: translate(-50%, -50%);
    animation: rippleExpand var(--dur) ease-out infinite;
    animation-delay: var(--delay);
  }

  @keyframes rippleExpand {
    0% { width: 0; height: 0; opacity: 0.4; border-width: 0.5px; }
    100% { width: 320px; height: 320px; opacity: 0; border-width: 0.2px; }
  }

  /* Center glow */
  .lake-center {
    position: absolute;
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 60px; height: 60px;
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(160,200,240,0.06) 0%,
      rgba(100,150,200,0.03) 40%,
      transparent 70%
    );
    animation: centerPulse 6s ease-in-out infinite;
  }

  @keyframes centerPulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
    50% { transform: translate(-50%, -50%) scale(1.3); opacity: 0.8; }
  }

  /* Surface shimmer lines */
  .shimmer {
    position: absolute;
    width: 120%; height: 0.5px;
    background: linear-gradient(90deg, transparent, rgba(160,200,240,0.08), transparent);
    left: -10%;
    animation: shimmerDrift var(--dur) ease-in-out infinite;
    animation-delay: var(--delay);
    opacity: 0;
  }

  @keyframes shimmerDrift {
    0%, 100% { opacity: 0; transform: translateY(0); }
    30% { opacity: 0.5; }
    50% { opacity: 0.7; transform: translateY(-20px); }
    70% { opacity: 0.3; }
  }

  /* Status text */
  .status-text {
    margin-top: 32px;
    text-align: center;
  }

  .status-line {
    font-family: 'Noto Serif SC', serif;
    font-size: 14px; font-weight: 300;
    color: rgba(160,190,220,0.5);
    letter-spacing: 0.12em;
    line-height: 2;
  }

  .status-count {
    color: rgba(180,210,240,0.7);
    font-weight: 400;
  }

  /* Bottom area */
  .bottom-area {
    padding-bottom: 100px;
    display: flex;
    justify-content: center;
  }

  .throw-btn {
    padding: 14px 48px;
    border-radius: 28px;
    background: transparent;
    border: 1px solid rgba(140,180,220,0.25);
    color: rgba(180,210,240,0.75);
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 15px; font-weight: 300;
    letter-spacing: 0.15em;
    cursor: pointer;
    transition: all 0.8s ease;
    position: relative;
    overflow: hidden;
  }

  .throw-btn::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 50%, rgba(160,200,240,0.06), transparent);
    opacity: 0; transition: opacity 0.8s ease;
  }

  .throw-btn:hover::before { opacity: 1; }

  .throw-btn:hover {
    border-color: rgba(180,210,240,0.4);
    color: rgba(200,225,250,0.9);
    box-shadow: 0 0 30px rgba(80,140,200,0.1);
  }

  /* Bottom Tab Bar */
  .tab-bar {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 84px;
    background: linear-gradient(to top, rgba(8,16,32,0.98) 0%, rgba(8,16,32,0.85) 60%, transparent 100%);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    display: flex; align-items: flex-start;
    padding: 12px 16px 20px;
  }

  .tab {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; gap: 4px;
    cursor: pointer;
    transition: all 0.4s ease;
  }

  .tab-icon {
    width: 24px; height: 24px;
    border-radius: 50%;
    transition: all 0.4s ease;
  }

  .tab.active .tab-icon {
    background: radial-gradient(circle, rgba(160,200,240,0.15), transparent);
    box-shadow: 0 0 16px rgba(120,170,220,0.1);
  }

  .tab-label {
    font-size: 10px; font-weight: 300;
    color: rgba(120,150,190,0.35);
    letter-spacing: 0.1em;
    transition: all 0.4s ease;
  }

  .tab.active .tab-label {
    color: rgba(180,210,240,0.7);
  }

  /* Tab icons – simple dots */
  .tab-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: rgba(140,170,200,0.3);
    margin: 8px auto 0;
    transition: all 0.4s ease;
  }

  .tab.active .tab-dot {
    background: rgba(180,215,245,0.6);
    box-shadow: 0 0 10px rgba(140,190,230,0.3);
  }

  /* Midnight gradient overlay at top */
  .vignette {
    position: absolute; inset: 0; pointer-events: none; z-index: 0;
    background: radial-gradient(ellipse at 50% 30%, transparent 40%, rgba(3,8,20,0.6) 100%);
  }
</style>
</head>
<body>
<div class="phone">
  <div class="vignette"></div>

  <!-- Stars -->
  <div class="stars-layer">
    <div class="star" style="top:12%;left:18%;--dur:4s;--delay:0s;"></div>
    <div class="star" style="top:8%;left:55%;--dur:5s;--delay:1.2s;"></div>
    <div class="star" style="top:15%;left:78%;--dur:3.5s;--delay:2.5s;"></div>
    <div class="star" style="top:22%;left:35%;--dur:4.5s;--delay:0.8s;"></div>
    <div class="star" style="top:6%;left:42%;--dur:5.5s;--delay:3s;"></div>
    <div class="star" style="top:18%;left:88%;--dur:4.2s;--delay:1.8s;"></div>
    <div class="star" style="top:25%;left:12%;--dur:6s;--delay:2.2s;"></div>
    <div class="star" style="top:10%;left:68%;--dur:3.8s;--delay:0.4s;"></div>
    <div class="star" style="top:28%;left:48%;--dur:5.2s;--delay:3.5s;"></div>
    <div class="star" style="top:5%;left:28%;--dur:4.8s;--delay:1.6s;"></div>
    <div class="star" style="top:20%;left:8%;--dur:5.8s;--delay:4s;"></div>
    <div class="star" style="top:14%;left:95%;--dur:4.3s;--delay:2.8s;"></div>
  </div>

  <div class="content">
    <div class="status-bar"></div>

    <div class="header">
      <div>
        <div class="header-title">心湖</div>
        <div class="header-subtitle">SHINKO</div>
      </div>
      <div class="header-avatar"></div>
    </div>

    <div class="lake-container">
      <!-- Ripples -->
      <div class="lake">
        <div class="ripple" style="--dur:8s;--delay:0s;"></div>
        <div class="ripple" style="--dur:8s;--delay:2s;"></div>
        <div class="ripple" style="--dur:8s;--delay:4s;"></div>
        <div class="ripple" style="--dur:8s;--delay:6s;"></div>
        <div class="lake-center"></div>
        <div class="shimmer" style="top:25%;--dur:5s;--delay:0s;"></div>
        <div class="shimmer" style="top:40%;--dur:6s;--delay:1.5s;"></div>
        <div class="shimmer" style="top:55%;--dur:5.5s;--delay:3s;"></div>
        <div class="shimmer" style="top:70%;--dur:6.5s;--delay:4.5s;"></div>

        <!-- Star reflections on water -->
        <div class="star-reflection" style="top:20%;left:30%;--w:40px;--bright:0.3;--dur:4s;--delay:0s;"></div>
        <div class="star-reflection" style="top:35%;left:60%;--w:50px;--bright:0.25;--dur:5s;--delay:1.5s;"></div>
        <div class="star-reflection" style="top:50%;left:20%;--w:35px;--bright:0.2;--dur:4.5s;--delay:3s;"></div>
        <div class="star-reflection" style="top:65%;left:70%;--w:45px;--bright:0.28;--dur:3.8s;--delay:2s;"></div>
        <div class="star-reflection" style="top:30%;left:80%;--w:30px;--bright:0.22;--dur:5.2s;--delay:4s;"></div>
      </div>

      <div class="status-text">
        <div class="status-line">此刻万籁俱寂</div>
        <div class="status-line">有 <span class="status-count">零</span> 人听见你的回响</div>
      </div>

      <div class="bottom-area" style="margin-top:36px;">
        <button class="throw-btn">投一颗石子</button>
      </div>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tab active">
      <div class="tab-dot"></div>
      <span class="tab-label">心湖</span>
    </div>
    <div class="tab">
      <div class="tab-dot"></div>
      <span class="tab-label">涟漪</span>
    </div>
    <div class="tab">
      <div class="tab-dot"></div>
      <span class="tab-label">回响</span>
    </div>
    <div class="tab">
      <div class="tab-dot"></div>
      <span class="tab-label">宿缘</span>
    </div>
  </div>
</div>
</body>
</html>
