<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心汐 · 墨染涟漪</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;300;400;600;700&family=Noto+Sans+SC:wght@200;300;400&display=swap');

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh;
    background: linear-gradient(180deg, #e8e0d5 0%, #f0ebe0 40%, #f5f0e8 100%);
    font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
  }

  .phone {
    width: 390px; height: 844px;
    background: linear-gradient(180deg, #f5f0e8 0%, #f7f3ed 30%, #faf7f2 100%);
    border-radius: 44px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.03), 0 0 120px rgba(180,160,130,0.15), 0 30px 80px rgba(0,0,0,0.06);
  }

  /* Paper texture overlay */
  .paper-texture {
    position: absolute; inset: 0; pointer-events: none; z-index: 0;
    opacity: 0.06;
    background:
      repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px),
      repeating-linear-gradient(90deg, transparent, transparent 3px, rgba(0,0,0,0.02) 3px, rgba(0,0,0,0.02) 6px);
  }

  .content {
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    height: 100%; padding: 0 32px;
  }

  .status-bar { height: 54px; }

  /* Header – calligraphic style */
  .header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0 24px;
  }

  .header-title {
    font-family: 'Noto Serif SC', serif;
    font-size: 30px; font-weight: 600;
    color: rgba(40,35,30,0.7);
    letter-spacing: 0.2em;
  }

  .header-subtitle {
    font-size: 11px; font-weight: 300;
    color: rgba(120,110,95,0.35);
    letter-spacing: 0.25em;
    margin-top: 2px;
  }

  .header-avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, rgba(180,170,150,0.3), rgba(140,120,100,0.2));
    border: 1px solid rgba(140,120,100,0.15);
  }

  /* Lake area */
  .lake-container {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    position: relative;
  }

  /* The ink wash lake – square-ish for ink painting feel */
  .lake {
    width: 260px; height: 260px;
    border-radius: 50%;
    position: relative;
    overflow: hidden;
  }

  /* Ink layers – center dark, edges fading */
  .ink-layer {
    position: absolute;
    border-radius: 50%;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    animation: inkBreathe var(--dur) ease-in-out infinite;
    animation-delay: var(--delay);
  }

  @keyframes inkBreathe {
    0%, 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    50% { opacity: 0.85; transform: translate(-50%, -50%) scale(1.03); }
  }

  /* Ink wash rings */
  .ink-ring {
    position: absolute;
    border-radius: 50%;
    left: 50%; top: 50%;
    border: var(--ring-w) solid var(--ring-color);
    animation: ringExpand var(--dur) ease-out infinite;
    animation-delay: var(--delay);
  }

  @keyframes ringExpand {
    0% { width: 0; height: 0; transform: translate(-50%, -50%); opacity: 0.5; }
    100% { width: var(--max-w); height: var(--max-h); transform: translate(-50%, -50%); opacity: 0; }
  }

  /* Brush stroke accent */
  .brush-stroke {
    position: absolute;
    width: 2px;
    background: linear-gradient(180deg, transparent, rgba(80,70,55,0.06), transparent);
    border-radius: 1px;
    animation: strokeDrift var(--dur) ease-in-out infinite;
    animation-delay: var(--delay);
  }

  @keyframes strokeDrift {
    0%, 100% { opacity: 0.2; transform: translateX(0); }
    50% { opacity: 0.5; transform: translateX(3px); }
  }

  /* Status text – vertical column style */
  .status-text {
    margin-top: 40px;
    text-align: center;
  }

  .status-line {
    font-family: 'Noto Serif SC', serif;
    font-size: 14px; font-weight: 300;
    color: rgba(80,70,60,0.45);
    letter-spacing: 0.15em;
    line-height: 2.2;
    writing-mode: horizontal-tb;
  }

  .status-poem {
    display: block;
    font-size: 13px;
    font-weight: 300;
    color: rgba(100,90,75,0.35);
    letter-spacing: 0.2em;
    line-height: 2.4;
  }

  .status-count {
    color: rgba(60,50,40,0.55);
    font-weight: 400;
  }

  /* Bottom area */
  .bottom-area {
    padding-bottom: 100px;
    display: flex;
    justify-content: center;
  }

  .throw-btn {
    padding: 14px 48px;
    border-radius: 28px;
    background: transparent;
    border: 1px solid rgba(120,100,80,0.2);
    color: rgba(80,70,55,0.6);
    font-family: 'Noto Serif SC', serif;
    font-size: 15px; font-weight: 300;
    letter-spacing: 0.2em;
    cursor: pointer;
    transition: all 0.8s ease;
    position: relative;
  }

  .throw-btn::after {
    content: '';
    position: absolute;
    inset: 4px;
    border-radius: 24px;
    border: 0.5px solid rgba(120,100,80,0.08);
    transition: all 0.8s ease;
  }

  .throw-btn:hover {
    border-color: rgba(100,80,60,0.35);
    color: rgba(50,40,30,0.75);
    background: rgba(160,140,110,0.06);
  }

  .throw-btn:hover::after {
    border-color: rgba(120,100,80,0.15);
  }

  /* Bottom Tab Bar */
  .tab-bar {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 84px;
    background: linear-gradient(to top, rgba(245,240,232,0.95) 0%, rgba(245,240,232,0.7) 60%, transparent 100%);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    display: flex; align-items: flex-start;
    padding: 12px 16px 20px;
    border-top: 0.5px solid rgba(160,140,110,0.1);
  }

  .tab {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; gap: 4px;
    cursor: pointer;
    transition: all 0.4s ease;
  }

  .tab-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: rgba(140,120,90,0.2);
    margin: 8px auto 0;
    transition: all 0.4s ease;
  }

  .tab.active .tab-dot {
    background: rgba(80,65,45,0.45);
    box-shadow: 0 0 6px rgba(80,65,45,0.1);
  }

  .tab-label {
    font-size: 10px; font-weight: 300;
    color: rgba(140,120,90,0.3);
    letter-spacing: 0.12em;
    transition: all 0.4s ease;
    font-family: 'Noto Serif SC', serif;
  }

  .tab.active .tab-label {
    color: rgba(80,65,45,0.55);
  }
</style>
</head>
<body>
<div class="phone">
  <div class="paper-texture"></div>

  <div class="content">
    <div class="status-bar"></div>

    <div class="header">
      <div>
        <div class="header-title">心湖</div>
        <div class="header-subtitle">SHINKO</div>
      </div>
      <div class="header-avatar"></div>
    </div>

    <div class="lake-container">
      <div class="lake">
        <!-- Ink layers – from dark center to fading edges, like ink on rice paper -->
        <div class="ink-layer" style="width:40px;height:40px;background:radial-gradient(circle,rgba(60,50,35,0.22),rgba(80,68,48,0.12) 40%,transparent 70%);--dur:6s;--delay:0s;z-index:5;"></div>
        <div class="ink-layer" style="width:90px;height:90px;background:radial-gradient(circle,rgba(70,58,40,0.14),rgba(85,72,50,0.06) 50%,transparent 80%);--dur:7s;--delay:1s;z-index:4;"></div>
        <div class="ink-layer" style="width:150px;height:150px;background:radial-gradient(circle,rgba(75,62,42,0.08),rgba(90,76,52,0.03) 50%,transparent 85%);--dur:8s;--delay:2s;z-index:3;"></div>
        <div class="ink-layer" style="width:210px;height:210px;background:radial-gradient(circle,rgba(80,66,44,0.04),rgba(95,80,54,0.015) 50%,transparent 90%);--dur:9s;--delay:3s;z-index:2;"></div>
        <div class="ink-layer" style="width:260px;height:260px;background:radial-gradient(circle,rgba(85,70,46,0.02),rgba(100,84,56,0.008) 50%,transparent 95%);--dur:10s;--delay:4s;z-index:1;"></div>

        <!-- Ink rings expanding outward -->
        <div class="ink-ring" style="--ring-w:1px;--ring-color:rgba(70,58,38,0.15);--max-w:280px;--max-h:280px;--dur:12s;--delay:0s;"></div>
        <div class="ink-ring" style="--ring-w:0.8px;--ring-color:rgba(75,62,40,0.1);--max-w:280px;--max-h:280px;--dur:12s;--delay:3s;"></div>
        <div class="ink-ring" style="--ring-w:0.6px;--ring-color:rgba(80,66,42,0.08);--max-w:280px;--max-h:280px;--dur:12s;--delay:6s;"></div>
        <div class="ink-ring" style="--ring-w:0.5px;--ring-color:rgba(85,70,44,0.06);--max-w:280px;--max-h:280px;--dur:12s;--delay:9s;"></div>

        <!-- Brush stroke accents -->
        <div class="brush-stroke" style="top:15%;left:35%;height:60px;--dur:8s;--delay:0s;"></div>
        <div class="brush-stroke" style="top:22%;left:62%;height:45px;--dur:9s;--delay:2s;"></div>
        <div class="brush-stroke" style="top:55%;left:28%;height:50px;--dur:8.5s;--delay:4s;"></div>
        <div class="brush-stroke" style="top:48%;left:70%;height:55px;--dur:9.5s;--delay:5.5s;"></div>

        <!-- Small ink dots like splatter -->
        <div style="position:absolute;width:2px;height:2px;border-radius:50%;background:rgba(60,48,30,0.12);top:30%;left:42%;animation:inkBreathe 5s ease-in-out infinite;animation-delay:1s;"></div>
        <div style="position:absolute;width:1.5px;height:1.5px;border-radius:50%;background:rgba(65,50,32,0.1);top:45%;left:58%;animation:inkBreathe 6s ease-in-out infinite;animation-delay:3s;"></div>
        <div style="position:absolute;width:1.5px;height:1.5px;border-radius:50%;background:rgba(55,42,28,0.09);top:60%;left:38%;animation:inkBreathe 5.5s ease-in-out infinite;animation-delay:5s;"></div>
      </div>

      <div class="status-text">
        <div class="status-line">心如止水</div>
        <div class="status-line">有 <span class="status-count">零</span> 人听见你的回响</div>
        <span class="status-poem">—— 万籁此俱寂</span>
      </div>

      <div class="bottom-area" style="margin-top:36px;">
        <button class="throw-btn">投一颗石子</button>
      </div>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tab active">
      <div class="tab-dot"></div>
      <span class="tab-label">心湖</span>
    </div>
    <div class="tab">
      <div class="tab-dot"></div>
      <span class="tab-label">涟漪</span>
    </div>
    <div class="tab">
      <div class="tab-dot"></div>
      <span class="tab-label">回响</span>
    </div>
    <div class="tab">
      <div class="tab-dot"></div>
      <span class="tab-label">宿缘</span>
    </div>
  </div>
</div>
</body>
</html>
